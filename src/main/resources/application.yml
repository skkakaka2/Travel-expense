spring:
  application:
    name: travel-expense
  profiles:
    active: ${TRAVEL_PROFILES_ACTIVE:dev}
  config:
    import: "nacos:${spring.application.name}-${spring.profiles.active}.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: pi.home:8848
      username: nacos
      password: nacos
      discovery:
        namespace: dev
        group: DEFAULT_GROUP
